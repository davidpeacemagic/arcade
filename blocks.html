<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Blocks · Beat The Arcade</title>
    <meta
      name="description"
      content="Blocks with seven-bag randomiser, SRS wall kicks, ghost piece, hold and a configurable next queue."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060a'/%3E%3Crect x='4' y='18' width='12' height='10' fill='%23b6ff2b'/%3E%3Crect x='16' y='8' width='12' height='10' fill='%23b6ff2b'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/game.css" />
  </head>

  <body
    class="site"
    style="--accent: #b6ff2b; --accent-rgb: 182, 255, 43; --accent-2: #00f0ff; --accent-2-rgb: 0, 240, 255"
  >
    <a class="visually-hidden" href="#main">Skip to content</a>

    <header class="hdr">
      <a class="hdr__back" href="index.html">←<span>Arcade</span></a>
      <span class="hdr__title">Blocks</span>
      <span class="hdr__spacer"></span>
      <div class="hdr__tools">
        <button
          class="btn btn--icon btn--ghost"
          type="button"
          data-tool="mute"
          aria-pressed="true"
          aria-label="Sound off"
        >
          🔇
        </button>
        <button
          class="btn btn--icon btn--ghost"
          type="button"
          data-tool="settings"
          aria-label="Open settings"
        >
          ⚙
        </button>
      </div>
    </header>

    <main id="main" class="site__main wrap">
      <div class="page-head">
        <div>
          <span class="eyebrow">Game 03 · Seven-bag · SRS</span>
          <h1 class="display">Blocks</h1>
        </div>
        <button class="btn" type="button" data-tool="settings">⚙ Settings</button>
      </div>

      <div class="stage stage--split">
        <section class="bezel bezel--narrow ticks">
          <div class="hud">
            <div class="hud__cell">
              <h3>Score</h3>
              <b id="blocksScore">0</b>
            </div>
            <div class="hud__cell">
              <h3>Level</h3>
              <b id="blocksLevel">1</b>
            </div>
            <div class="hud__cell">
              <h3>Lines</h3>
              <b id="blocksLines">0</b>
            </div>
          </div>

          <div class="bezel__screen screen--blocks">
            <canvas id="blocksCanvas" aria-label="Blocks play field"></canvas>
          </div>
        </section>

        <aside class="side">
          <div class="side__box">
            <h3>Hold</h3>
            <canvas id="blocksHold" width="120" height="96" aria-label="Held piece"></canvas>
          </div>
          <div class="side__box">
            <h3>Next</h3>
            <canvas id="blocksNext" width="120" height="200" aria-label="Next pieces"></canvas>
          </div>
          <div class="side__box">
            <h3>Best</h3>
            <b class="mono" id="blocksBest" style="font-size: 1.15rem; color: var(--accent)">0</b>
          </div>
        </aside>
      </div>

      <div class="pad--grid pad" id="blocksPad" style="max-width: 460px; margin: 12px auto 0">
        <button class="pad__btn" type="button" data-control="left" aria-label="Move left">◀</button>
        <button class="pad__btn" type="button" data-control="rotate" aria-label="Rotate clockwise">↻</button>
        <button class="pad__btn" type="button" data-control="right" aria-label="Move right">▶</button>
        <button class="pad__btn" type="button" data-control="down" aria-label="Soft drop">▼</button>
        <button class="pad__btn" type="button" data-control="hold" aria-label="Hold piece">HOLD</button>
        <button class="pad__btn pad__btn--accent" type="button" data-control="hardDrop" aria-label="Hard drop">
          ⤓<small>HARD</small>
        </button>
      </div>

      <p class="keys keyboard-only">
        <span><kbd>←</kbd><kbd>→</kbd> move</span>
        <span><kbd>↑</kbd>/<kbd>X</kbd> rotate</span>
        <span><kbd>↓</kbd> soft drop</span>
        <span><kbd>space</kbd> hard drop</span>
        <span><kbd>C</kbd> hold</span>
        <span><kbd>P</kbd> pause</span>
      </p>
    </main>

    <div id="settings"></div>

    <footer class="ftr">
      <div class="wrap ftr__inner">
        <span>© <span data-year>2026</span> Beat The Arcade</span>
        <span>High scores are saved on this device</span>
      </div>
    </footer>

    <script src="js/core/storage.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/core/canvas.js"></script>
    <script src="js/core/loop.js"></script>
    <script src="js/core/input.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/settings.js"></script>
    <script src="js/games/blocks.js"></script>
  </body>
</html>
